    qstats.forEach(function(qs){ (byType[qs.type] = byType[qs.type] || []).push(qs); });
    if(byType.mc.length && byType.short.length){
      container.appendChild(el("h2", {}, ["문항 유형별 정답률 비교"]));
      var typeTable = el("table", {}, [el("thead",{},[el("tr",{},[
        el("th",{},["유형"]), el("th",{class:"num"},["문항 수"]), el("th",{class:"num"},["평균 정답률"])
      ])])]);
      var typeBody = el("tbody");
      [["mc","객관식"],["short","단답형"]].forEach(function(t){
        var list = byType[t[0]];
        var avgRate = mean(list.map(function(qs){ return qs.rate; }));
        typeBody.appendChild(el("tr",{},[el("td",{},[t[1]]), el("td",{class:"num"},[list.length+"문항"]), el("td",{class:"num"},[Math.round(avgRate*100)+"%"])]));
      });
      typeTable.appendChild(typeBody);
      container.appendChild(typeTable);
    }

    container.appendChild(el("h2", {}, ["학생별 성적"]));
    var stuTable = el("table", {}, [el("thead",{},[el("tr",{},[
      el("th",{class:"num"},["순위"]), el("th",{},["번호"]), el("th",{},["이름"]), el("th",{class:"num"},["총점"]), el("th",{class:"num"},["정답 수"]), el("th",{class:"num"},["정답률"])
    ])])]);
    var stuBody = el("tbody");
    ranked.slice().sort(function(a,b){ return a.rank-b.rank; }).forEach(function(r){
      stuBody.appendChild(el("tr",{},[
        el("td",{class:"num"},[String(r.rank)]),
        el("td",{},[r.num]),
        el("td",{},[r.name]),
        el("td",{class:"num"},[String(r.score)]),
        el("td",{class:"num"},[r.correctCount+"/"+r.total]),
        el("td",{class:"num"},[Math.round(r.rate*100)+"%"])
      ]));
    });
    stuTable.appendChild(stuBody);
    container.appendChild(stuTable);

    container.appendChild(el("h2", {}, ["학생 × 문항 정오답 히트맵"]));
    container.appendChild(el("p", {class:"note"}, ["점수 높은 순으로 정렬했습니다. 붉은 칸이 세로로 몰려 있으면 그 문항을 많은 학생이 틀렸다는 뜻이에요."]));
    var heatRanked = ranked.slice().sort(function(a,b){ return a.rank-b.rank; });
    var pHeatHead = [el("th",{},["학생"])];
    (heatRanked[0] ? heatRanked[0].detail : []).forEach(function(d){ pHeatHead.push(el("th",{class:"num"},[String(d.no)])); });
    var pHeatTable = el("table", {}, [el("thead",{},[el("tr",{},pHeatHead)])]);
    var pHeatBody = el("tbody");
    heatRanked.forEach(function(r){
      var cells = [el("td",{},[r.num+"번 "+r.name])];
      r.detail.forEach(function(d){
        cells.push(el("td",{class:"num "+(d.correct?"heat-good":"heat-bad")},[d.correct?"O":"X"]));
      });
      pHeatBody.appendChild(el("tr",{},cells));
    });
    pHeatTable.appendChild(pHeatBody);
    container.appendChild(pHeatTable);

  }

  /* 인쇄(브라우저의 'PDF로 저장') - 이 화면에서 인쇄 창이 막히면 파일 저장 쪽을 안내합니다 */
  function exportPDF(args, notify){
    fillPrintReport.apply(null, args);
    var ok = true;
    try{ window.print(); }catch(e){ ok = false; }
    if(!ok && notify) notify("인쇄 창을 열지 못했습니다. 옆의 '리포트 파일 저장'을 이용해주세요.", "warning");
  }

  var REPORT_CSS = "body{margin:0;padding:28px;background:#fff;color:#111;font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;}" +
    "h1{font-size:1.4rem;margin:0 0 4px;}.meta{color:#555;font-size:0.85rem;margin:0 0 20px;}" +
    "h2{font-size:1.05rem;margin:24px 0 8px;padding-top:14px;border-top:1px solid #ddd;}h2:first-of-type{border-top:none;padding-top:0;}" +
    "table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:0.85rem;}" +
    "th,td{padding:6px 9px;border-bottom:1px solid #ddd;text-align:left;}th{background:#f3f3f1;font-weight:700;}" +
    "td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}" +
    ".tiles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}" +
    ".tile{border:1px solid #ddd;border-radius:6px;padding:9px 11px;}.tile .label{font-size:0.75rem;color:#555;}.tile .value{font-size:1.15rem;font-weight:700;}" +
    ".p-chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:0.74rem;font-weight:700;}" +
    ".p-band-bar{display:flex;height:18px;border-radius:5px;overflow:hidden;margin-bottom:8px;border:1px solid #ddd;}" +
    ".heat-good{background:#dcf3dc;color:#0ca30c;text-align:center;font-weight:700;}" +
    ".heat-bad{background:#fbe1e1;color:#c23333;text-align:center;font-weight:700;}" +
    "@media print{body{padding:0;}tr{break-inside:avoid;}h2{break-after:avoid;}}";

  /* 리포트를 파일로 저장 - 열어서 브라우저에서 인쇄하면 PDF로 만들 수 있습니다 */
  function saveReportFile(args, notify){
    fillPrintReport.apply(null, args);
    var title = (state.examTitle ? state.examTitle + " 결과 리포트" : "학생 평가 결과 리포트");
    var body = document.getElementById("printReport").innerHTML;
    var html = '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>' + xmlEscape(title) + '</title><style>' + REPORT_CSS + '</style></head><body>' + body + '</body></html>';
    var name = (state.examTitle ? state.examTitle + "_" : "") + "결과리포트";
    return deliverFile([
      { filename: name + ".html", data: html,
        note: "리포트를 저장했습니다. 파일을 열고 인쇄(Ctrl+P) → 'PDF로 저장'을 고르면 PDF가 됩니다." },
      { filename: name + ".txt", data: document.getElementById("printReport").innerText,
        note: "형식 제한으로 텍스트 파일(.txt)로 저장했습니다." }
    ], notify);
  }

  function openStudentModal(r){
    var dlg = document.getElementById("studentModal");
    document.getElementById("modalName").textContent = r.num + "번 " + r.name + " · " + r.score + "점";
    var body = document.getElementById("modalBody");
    body.innerHTML = "";
    var grid = el("div", {class:"grid-oX"});
    r.detail.forEach(function(d){
      grid.appendChild(el("div", {class:"cell-oX " + (d.correct?"correct":"wrong")}, [
        el("div", {class:"q"}, [String(d.no)]),
        el("div", {class:"mark"}, [d.correct ? "O" : "X"])
      ]));
    });
    body.appendChild(grid);
    if(typeof dlg.showModal === "function") dlg.showModal();
  }
  document.getElementById("modalClose").addEventListener("click", function(){
    document.getElementById("studentModal").close();
  });

  /* ---------- help / user guide ---------- */
  var HELP_SECTIONS = [
    { key:"start", label:"시작하기", html:
      '<p><b>문항 설정 → 정답 입력 → 학생 답안 입력 → 분석 결과</b>, 4단계 순서로 진행합니다.</p>' +
      '<ul>' +
        '<li>답안 시트가 이미 있다면 1단계의 <b>답안 시트 한 번에 불러오기</b>에 파일을 올리세요. 문항 수와 학생 답안이 한 번에 채워집니다.</li>' +
        '<li>입력한 내용은 <b>이 브라우저에 자동 저장</b>됩니다. 새로고침해도 이어서 할 수 있어요.</li>' +
        '<li>궁금할 때마다 이 버튼을 다시 눌러 설명을 볼 수 있습니다.</li>' +
      '</ul>'
    },
    { key:"step1", label:"1. 문항 설정", html:
      '<ul>' +
        '<li><b>답안 시트 한 번에 불러오기</b> — 엑셀·CSV를 올리면 평가명, 문항 수, 학생 답안을 자동으로 읽습니다. 시트에 정답까지 있으면 채점 결과로 바로 넘어갑니다.</li>' +
        '<li>인식 조건 — 머리글에 <b>이름</b>과 <b>1, 2, 3…</b> 문항 번호 열. \'제출시각\' 같은 열은 자동으로 건너뜁니다.</li>' +
        '<li>이름 칸에 <b>정답</b> 행, <b>배점</b> 행을 넣어두면 정답과 문항별 배점으로 함께 읽어옵니다.</li>' +
        '<li><b>총 문항 수</b> — 최대 200개까지</li>' +
        '<li><b>배점 방식</b> — 동일 배점(100점 자동 분배) 또는 문항별 직접 입력</li>' +
      '</ul>'
    },
    { key:"step2", label:"2. 정답 입력", html:
      '<ul>' +
        '<li>표에 직접 입력하거나, <b>엑셀·CSV 파일 업로드</b></li>' +
        '<li>정답이 여러 개면 <b>/</b>로 구분 (예: 사과/apple)</li>' +
        '<li>채점할 때 <b>①②③ → 1,2,3</b>, 전각 숫자, 띄어쓰기 차이는 자동으로 같은 답으로 봅니다</li>' +
        '<li>파일 열 순서가 달라도 헤더 이름으로 자동 인식</li>' +
        '<li>구글 시트 링크로 CSV·엑셀 바로 내보내기 가능</li>' +
      '</ul>'
    },
    { key:"step3", label:"3. 학생 답안", html:
      '<ul>' +
        '<li>표에 직접 입력하거나, <b>엑셀·CSV 파일 업로드</b></li>' +
        '<li>구글 시트 전체를 그대로 올려도 OK (가져올 탭 선택)</li>' +
        '<li>업로드하면 표에 자동으로 채워져 바로 확인·수정</li>' +
      '</ul>'
    },
    { key:"step4", label:"4. 분석 결과", html:
      '<ul>' +
        '<li><b>요약</b> — 기본 통계, 성취수준 분포, 학생별 점수</li>' +
        '<li><b>문항별 분석</b> — 정답률, 오답 TOP 5, 유형 비교</li>' +
        '<li><b>학생별 성적</b> — 정렬 가능한 표, 정오답 히트맵</li>' +
        '<li><b>결과 인쇄 · PDF로 저장</b> — 인쇄 창에서 “PDF로 저장” 선택</li>' +
        '<li><b>리포트 파일 저장</b> — 인쇄가 막힐 때 리포트를 파일로 받아 열어서 인쇄</li>' +
        '<li><b>채점 결과 저장 / 표 복사</b> — 문항별 O·X까지 엑셀로</li>' +
      '</ul>'
    },
    { key:"tips", label:"팁", html:
      '<ul>' +
        '<li>다른 반·다른 시험을 채점하려면 오른쪽 위 <b>새 평가 시작</b>으로 내용을 비우세요</li>' +
        '<li>저장 버튼이 막히면 <b>표 복사</b>로 엑셀·구글 시트에 그대로 붙여넣을 수 있습니다</li>' +
        '<li>오른쪽 위 버튼으로 <b>라이트·다크 모드</b> 전환</li>' +
        '<li>데이터는 이 브라우저에만 저장됩니다. 다른 기기로 옮기려면 파일로 내보내세요.</li>' +
      '</ul>'
    }
  ];

  function renderHelpSection(key){
    var section = HELP_SECTIONS.find(function(s){ return s.key===key; }) || HELP_SECTIONS[0];
    document.querySelectorAll(".help-tabs .tab-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.key===section.key);
    });
    document.getElementById("helpContent").innerHTML = section.html;
  }

  document.getElementById("helpBtn").addEventListener("click", function(){
    var body = document.getElementById("helpBody");
    if(!body.dataset.filled){
      var tabs = el("div", {class:"tabs help-tabs"});
      HELP_SECTIONS.forEach(function(s){
        var btn = el("button", {class:"tab-btn", type:"button", "data-key":s.key, onclick:function(){ renderHelpSection(s.key); }}, [s.label]);
        tabs.appendChild(btn);
      });
      body.appendChild(tabs);
      body.appendChild(el("div", {id:"helpContent"}));
      body.dataset.filled = "1";
      renderHelpSection("start");
    }
    var dlg = document.getElementById("helpModal");
    if(typeof dlg.showModal === "function") dlg.showModal();
  });
  document.getElementById("helpClose").addEventListener("click", function(){
    document.getElementById("helpModal").close();
  });

  /* ---------- boot ---------- */
  function renderAll(){
    renderStepper();
    if(state.step===1) renderStep1();
    else if(state.step===2) renderStep2();
    else if(state.step===3) renderStep3();
    else renderStep4();
  }

  load();
  ensureQuestions();
  ensureStudentAnswerLength();
  applyTheme(getTheme());
  document.getElementById("themeToggle").addEventListener("click", cycleTheme);

  var resetModal = document.getElementById("resetModal");
  function closeReset(){ try{ resetModal.close(); }catch(e){} }
  document.getElementById("resetBtn").addEventListener("click", function(){
    if(typeof resetModal.showModal === "function") resetModal.showModal();
  });
  document.getElementById("resetCancel").addEventListener("click", closeReset);
  document.getElementById("resetNo").addEventListener("click", closeReset);
  document.getElementById("resetYes").addEventListener("click", function(){
    closeReset();
    state.step = 1;
    state.numQuestions = 10;
    state.customScoring = false;
    state.questions = [];
    state.students = [];
    state.examTitle = "";
    state.qInputMode = "manual";
    state.sInputMode = "manual";
    state.sort = { key: "rank", dir: "asc" };
    state.chartView = "chart";
    state.resultTab = "summary";
    importNotice = null;
    ensureQuestions();
    save();
    renderAll();
  });
  renderAll();
})();
</script>
