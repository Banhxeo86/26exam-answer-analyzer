<meta charset="utf-8">
<title>학생 평가 결과 분석기</title>
<style>
  :root{
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --surface-2: #f2f1ec;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --accent:    #2a78d6;
    --accent-wash: rgba(42,120,214,0.08);
    --good:     #0ca30c;
    --warning:  #b5790a;
    --critical: #d03b3b;
    --good-bg: rgba(12,163,12,0.10);
    --warning-bg: rgba(250,178,25,0.16);
    --critical-bg: rgba(208,59,59,0.10);
    --band-1: #86b6ef;
    --band-2: #5598e7;
    --band-3: #2a78d6;
    --band-4: #1c5cab;
    --band-5: #104281;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --surface-2: #232322;
      --text-1:    #ffffff;
      --text-2:    #c3c2b7;
      --text-3:    #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --accent:    #3987e5;
      --accent-wash: rgba(57,135,229,0.14);
      --good:     #0ca30c;
      --warning:  #fab219;
      --critical: #e66767;
      --good-bg: rgba(12,163,12,0.16);
      --warning-bg: rgba(250,178,25,0.14);
      --critical-bg: rgba(230,103,103,0.14);
      --band-1: #b7d3f6;
      --band-2: #86b6ef;
      --band-3: #5598e7;
      --band-4: #3987e5;
      --band-5: #1c5cab;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #232322;
    --text-1:    #ffffff;
    --text-2:    #c3c2b7;
    --text-3:    #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --accent:    #3987e5;
    --accent-wash: rgba(57,135,229,0.14);
    --good:     #0ca30c;
    --warning:  #fab219;
    --critical: #e66767;
    --good-bg: rgba(12,163,12,0.16);
    --warning-bg: rgba(250,178,25,0.14);
    --critical-bg: rgba(230,103,103,0.14);
    --band-1: #b7d3f6;
    --band-2: #86b6ef;
    --band-3: #5598e7;
    --band-4: #3987e5;
    --band-5: #1c5cab;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --surface-2: #f2f1ec;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,0.10);
    --accent:    #2a78d6;
    --accent-wash: rgba(42,120,214,0.08);
    --good-bg: rgba(12,163,12,0.10);
    --warning-bg: rgba(250,178,25,0.16);
    --critical-bg: rgba(208,59,59,0.10);
    --band-1: #86b6ef;
    --band-2: #5598e7;
    --band-3: #2a78d6;
    --band-4: #1c5cab;
    --band-5: #104281;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font);
    background: var(--page);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
  .app{ max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
  .app-footer{ margin-top:40px; padding-top:16px; border-top:1px solid var(--border); color:var(--text-3); font-size:0.78rem; text-align:center; }

  .masthead{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
  .masthead-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .masthead .copy{ display:flex; flex-direction:column; gap:4px; }
  .masthead h1{ font-size:1.375rem; font-weight:700; margin:0; letter-spacing:-0.01em; text-wrap:balance; }
  .masthead p{ margin:0; color:var(--text-2); font-size:0.9rem; }

  .theme-toggle{
    display:flex; align-items:center; gap:6px; font:inherit; font-size:0.78rem; font-weight:600;
    padding:7px 12px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
    color:var(--text-2); cursor:pointer; flex:none; white-space:nowrap;
  }
  .theme-toggle:hover{ background:var(--surface-2); }
  .theme-toggle svg{ width:14px; height:14px; flex:none; }

  .stepper{ display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid var(--border); }
  .step-tab{
    flex:1; display:flex; align-items:center; gap:8px; padding:10px 8px 12px;
    background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
    cursor:pointer; color:var(--text-3); font:inherit; font-size:0.85rem; font-weight:600;
    text-align:left;
  }
  .step-tab .num{
    width:20px; height:20px; border-radius:50%; background:var(--surface-2); color:var(--text-3);
    display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700;
    flex:none;
  }
  .step-tab.active{ color:var(--text-1); border-bottom-color:var(--accent); }
  .step-tab.active .num{ background:var(--accent); color:#fff; }
  .step-tab.done{ color:var(--text-2); cursor:pointer; }
  .step-tab.done .num{ background:var(--accent-wash); color:var(--accent); }
  .step-tab:disabled{ cursor:not-allowed; opacity:0.55; }
  .step-tab:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .step-tab .label{ display:none; }
  @media (min-width:640px){ .step-tab .label{ display:inline; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px; margin-bottom:16px;
  }
  .card h2{ font-size:1.05rem; font-weight:700; margin:0 0 4px; }
  .card .hint{ color:var(--text-2); font-size:0.85rem; margin:0 0 16px; }

  .field{ display:flex; flex-direction:column; gap:6px; font-size:0.82rem; color:var(--text-2); font-weight:600; }
  input[type=text], input[type=number], select, textarea{
    font:inherit; font-size:0.9rem; padding:8px 10px; border-radius:6px;
    border:1px solid var(--border); background:var(--page); color:var(--text-1);
    width:100%;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  input[disabled]{ color:var(--text-3); background:var(--surface-2); }

  .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .row > *{ min-width:140px; }

  .btn{
    font:inherit; font-size:0.85rem; font-weight:600; padding:9px 16px; border-radius:7px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-1); cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ border-color:transparent; background:none; }
  .btn.small{ padding:5px 10px; font-size:0.78rem; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; justify-content:space-between; margin-top:22px; }
  .btn-row .right{ display:flex; gap:10px; }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    font:inherit; font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:99px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-2); cursor:pointer;
  }
  .tab-btn.active{ background:var(--accent-wash); border-color:var(--accent); color:var(--accent); }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:8px; }
  table{ border-collapse:collapse; width:100%; font-size:0.85rem; }
  th, td{ padding:8px 10px; border-bottom:1px solid var(--grid); text-align:left; white-space:nowrap; }
  th{ color:var(--text-2); font-weight:600; font-size:0.76rem; background:var(--surface-2); position:sticky; top:0; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--accent-wash); }
  td input{ padding:5px 7px; font-size:0.83rem; min-width:64px; }
  td.num, th.num{ font-variant-numeric: tabular-nums; text-align:right; }
  .row-actions{ text-align:center; }

  .gsheet-box{ border:1px solid var(--border); border-radius:8px; padding:12px 14px; background:var(--page); margin-bottom:12px; }
  .gsheet-label{ font-size:0.8rem; font-weight:600; color:var(--text-2); margin-bottom:8px; }
  .gsheet-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .gsheet-row input{ flex:1 1 240px; }

  .dropzone{
    border:1.5px dashed var(--border); border-radius:8px; padding:26px 16px; text-align:center;
    color:var(--text-2); font-size:0.85rem; cursor:pointer; background:var(--page);
  }
  .dropzone:hover{ border-color:var(--accent); color:var(--text-1); }
  .dropzone strong{ color:var(--accent); }
  .filename-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--good-bg); color:var(--good); border-radius:99px; padding:5px 12px; font-size:0.8rem; font-weight:600; margin-top:10px; }

  .export-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .export-hint{ font-size:0.76rem; color:var(--text-3); }
  .inline-msg{ width:100%; }
  .btn-row{ position:relative; flex-wrap:wrap; }

  .import-card{ border-color:var(--accent); background:linear-gradient(180deg, var(--accent-wash), transparent 120px), var(--surface); }
  .import-card .dropzone{ border-color:var(--accent); }
  .sheet-guide{ margin-top:14px; }
  .sheet-guide summary{ cursor:pointer; font-size:0.82rem; font-weight:600; color:var(--text-2); }
  .sheet-guide summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .sheet-guide .guide-body{ font-size:0.82rem; color:var(--text-2); padding-top:10px; }
  .sheet-guide ul{ margin:0 0 10px; padding-left:18px; }
  .sheet-guide li{ margin-bottom:4px; }
  .mini-sheet{ border:1px solid var(--grid); border-radius:6px; overflow-x:auto; background:var(--page); }
  .mini-sheet table{ font-size:0.78rem; }
  .mini-sheet th, .mini-sheet td{ padding:5px 9px; }

  .msg{ font-size:0.82rem; border-radius:7px; padding:9px 12px; margin-top:10px; }
  .msg.error{ background:var(--critical-bg); color:var(--critical); }
  .msg.ok{ background:var(--good-bg); color:var(--good); }
  .msg.warning{ background:var(--warning-bg); color:var(--warning); }
  .msg.info{ background:var(--accent-wash); color:var(--accent); }

  .exam-title{ font-size:0.82rem; color:var(--text-2); margin:0 0 10px; }
  .exam-title b{ color:var(--text-1); font-weight:700; }

  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:0.76rem; font-weight:700; padding:3px 9px; border-radius:99px; }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }
  .chip.good{ background:var(--good-bg); color:var(--good); }
  .chip.good .dot{ background:var(--good); }
  .chip.warning{ background:var(--warning-bg); color:var(--warning); }
  .chip.warning .dot{ background:var(--warning); }
  .chip.critical{ background:var(--critical-bg); color:var(--critical); }
  .chip.critical .dot{ background:var(--critical); }

  .tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  .tile{ background:var(--surface); padding:16px; }
  .tile .label{ font-size:0.76rem; color:var(--text-2); font-weight:600; margin-bottom:6px; }
  .tile .value{ font-size:1.55rem; font-weight:700; font-variant-numeric: tabular-nums; }
  .tile .value small{ font-size:0.85rem; font-weight:600; color:var(--text-3); }

  .bar-row{ display:grid; grid-template-columns:64px 1fr 56px; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  .bar-row .qlabel{ font-size:0.82rem; font-weight:600; color:var(--text-2); }
  .bar-track{ position:relative; height:14px; background:var(--grid); border-radius:4px; overflow:hidden; }
  .avg-line{ position:absolute; top:0; bottom:0; border-left:2px dashed var(--text-1); opacity:0.5; pointer-events:none; }
  .bar-fill{ height:100%; border-radius:4px 0 0 4px; }
  .bar-pct{ font-size:0.8rem; font-variant-numeric:tabular-nums; text-align:right; color:var(--text-2); }
  .bar-row.expanded{ background:var(--surface-2); border-radius:6px; }
  .bar-detail{ grid-column:1 / -1; padding:8px 4px 12px 74px; font-size:0.8rem; color:var(--text-2); display:none; }
  .bar-detail.open{ display:block; }
  .dist-item{ display:flex; justify-content:space-between; max-width:320px; padding:2px 0; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 6px; font-size:0.78rem; color:var(--text-2); }
  .legend .item{ display:flex; align-items:center; gap:6px; }
  .legend .swatch{ width:10px; height:10px; border-radius:2px; flex:none; }

  .flag-card{ border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:8px; background:var(--surface); }
  .flag-card .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
  .flag-card .top strong{ font-size:0.92rem; }
  .flag-card .answer-line{ font-size:0.82rem; color:var(--text-2); margin-bottom:8px; }
  .flag-card .answer-line b{ color:var(--text-1); font-weight:700; }
  .flag-card .dist-label{ font-size:0.72rem; font-weight:700; color:var(--text-3); margin-bottom:4px; }
  .flag-card .dist-item{ font-size:0.82rem; max-width:none; border-top:1px solid var(--grid); padding:5px 0; }
  .flag-card .dist-item:first-of-type{ border-top:none; }
  .flag-card .dist-item span:first-child{ color:var(--text-2); }
  .flag-card .dist-item span:last-child{ font-weight:700; font-variant-numeric:tabular-nums; }

  .view-toggle{ display:flex; justify-content:flex-end; margin-bottom:8px; }

  .result-tabs{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); }
  .result-tab{
    font:inherit; font-size:0.86rem; font-weight:600; padding:9px 4px 11px; margin-right:18px;
    background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
    cursor:pointer; color:var(--text-3);
  }
  .result-tab.active{ color:var(--text-1); border-bottom-color:var(--accent); }

  .band-bar{ display:flex; height:22px; border-radius:5px; background:var(--surface); border:1px solid var(--border); overflow:hidden; }
  .band-seg{ height:100%; }
  .band-seg + .band-seg{ margin-left:2px; }
  .band-legend{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:12px; font-size:0.8rem; }
  .band-legend .item{ display:flex; align-items:center; gap:7px; color:var(--text-2); }
  .band-legend .swatch{ width:10px; height:10px; border-radius:2px; flex:none; }
  .band-legend .count{ color:var(--text-1); font-weight:700; font-variant-numeric:tabular-nums; }

  dialog.modal{ border:1px solid var(--border); border-radius:10px; padding:0; width:min(560px,92vw); background:var(--surface); color:var(--text-1); }
  dialog.modal.modal-wide{ width:min(680px,94vw); }
  .help-tabs{ flex-wrap:wrap; }
  .help-body p{ margin:0 0 10px; color:var(--text-2); font-size:0.87rem; }
  .help-body ul{ margin:0; padding-left:20px; }
  .help-body li{ margin-bottom:7px; color:var(--text-2); font-size:0.87rem; line-height:1.5; }
  .help-body li:last-child{ margin-bottom:0; }
  .help-body b{ color:var(--text-1); }
  dialog.modal::backdrop{ background:rgba(0,0,0,0.45); }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border); }
  .modal-body{ padding:16px 18px; max-height:60vh; overflow-y:auto; }
  .grid-oX{ display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:6px; }
  .cell-oX{ border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-size:0.76rem; }
  .cell-oX .q{ color:var(--text-3); }
  .cell-oX.correct{ background:var(--good-bg); }
  .cell-oX.wrong{ background:var(--critical-bg); }
  .cell-oX .mark{ font-weight:700; }
  .cell-oX.correct .mark{ color:var(--good); }
  .cell-oX.wrong .mark{ color:var(--critical); }

  .heatmap-table th, .heatmap-table td{ padding:5px 8px; }
  .heat-cell{ text-align:center; font-weight:700; font-size:0.72rem; }
  .heat-good{ background:var(--good-bg); color:var(--good); }
  .heat-bad{ background:var(--critical-bg); color:var(--critical); }

  .empty{ color:var(--text-3); font-size:0.85rem; padding:16px 0; text-align:center; }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:after{ content:'⇅'; margin-left:4px; opacity:.4; font-size:0.7rem; }

  .print-report{ display:none; }
  .print-report, .print-report *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  .print-report{ background:#ffffff; color:#111111; font-family:var(--font); padding:0; }
  .print-report h1{ font-size:1.3rem; margin:0 0 4px; }
  .print-report .meta{ color:#555555; font-size:0.82rem; margin:0 0 18px; }
  .print-report h2{ font-size:1rem; margin:22px 0 8px; padding-top:12px; border-top:1px solid #dddddd; }
  .print-report h2:first-of-type{ border-top:none; padding-top:0; margin-top:0; }
  .print-report p.note{ color:#555555; font-size:0.8rem; margin:0 0 8px; }
  .print-report table{ width:100%; border-collapse:collapse; margin-bottom:6px; font-size:0.8rem; }
  .print-report th, .print-report td{ padding:5px 8px; border-bottom:1px solid #dddddd; text-align:left; }
  .print-report th{ background:#f3f3f1; font-weight:700; color:#111111; }
  .print-report td.num, .print-report th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .print-report tr{ break-inside:avoid; }
  .print-report h2{ break-after:avoid; }
  .print-report .tiles-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px; }
  .print-report .tile{ border:1px solid #dddddd; border-radius:6px; padding:8px 10px; break-inside:avoid; }
  .print-report .tile .label{ font-size:0.7rem; color:#555555; }
  .print-report .tile .value{ font-size:1.1rem; font-weight:700; }
  .print-report .p-chip{ display:inline-block; padding:2px 8px; border-radius:99px; font-size:0.72rem; font-weight:700; }
  .print-report .p-band-bar{ display:flex; height:18px; border-radius:5px; overflow:hidden; margin-bottom:8px; background:#ffffff; border:1px solid #dddddd; }
  .print-report .p-band-seg + .p-band-seg{ margin-left:1px; }
  .print-report .heat-good{ background:#dcf3dc; color:#0ca30c; text-align:center; font-weight:700; }
  .print-report .heat-bad{ background:#fbe1e1; color:#c23333; text-align:center; font-weight:700; }

  @media print{
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body *{ visibility:hidden; }
    .print-report, .print-report *{ visibility:visible; }
    .print-report{ display:block; position:absolute; top:0; left:0; width:100%; }
  }
</style>

<div class="app">
  <div class="masthead">
    <div class="copy">
      <h1>학생 평가 결과 분석기</h1>
      <p>답안 시트를 올리면 문항 수와 학생 답안이 자동으로 채워집니다. 정답만 확인하면 개인별 점수와 성취수준, 오답률 높은 문항을 바로 볼 수 있어요.</p>
    </div>
    <div class="masthead-actions">
      <button class="theme-toggle" id="resetBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        <span>새 평가 시작</span>
      </button>
      <button class="theme-toggle" id="helpBtn" type="button">

        <span>사용설명서</span>

  <nav class="stepper" id="stepper"></nav>

  <footer class="app-footer">© 강원특별자치도 금산초등학교 교사 고명진</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- state ---------- */
  var STORE_KEY = "saa_state_v3";
  var state = {
    step: 1,
    numQuestions: 10,
    customScoring: false,
    questions: [],
    students: [],
    examTitle: "",
    qInputMode: "manual",
    sInputMode: "manual",
    sort: { key: "rank", dir: "asc" },
    chartView: "chart",
    resultTab: "summary"
  };

  function equalScores(n){
    if(n<=0) return [];
    var base = Math.floor(100/n), rem = 100 - base*n;
    var out = [];
    for(var i=0;i<n;i++) out.push(base + (i<rem?1:0));
    return out;
  }

  function ensureQuestions(){
    var n = state.numQuestions;
    var qs = state.questions.slice(0,n);
    var eq = equalScores(n);
    for(var i=qs.length;i<n;i++){
      qs.push({ no:i+1, type:"mc", answer:"", score: state.customScoring ? 0 : eq[i] });
    }
    if(!state.customScoring){
      for(var j=0;j<n;j++) qs[j].score = eq[j];
    }
    for(var k=0;k<qs.length;k++) qs[k].no = k+1;
    state.questions = qs;
  }

  function ensureStudentAnswerLength(){
    var n = state.numQuestions;
    state.students.forEach(function(s){
      var a = s.answers.slice(0,n);
      while(a.length<n) a.push("");
      s.answers = a;
    });
  }

  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        Object.assign(state, parsed);
      }
    }catch(e){}
  }

  /* ---------- theme ---------- */
  var THEME_KEY = "saa_theme_v1";
  var THEME_ICONS = {
    system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>',
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>'
  };
  var THEME_LABELS = { system: "시스템 모드", light: "라이트 모드", dark: "다크 모드" };
  function getTheme(){
    try{ return localStorage.getItem(THEME_KEY) || "system"; }catch(e){ return "system"; }
  }
  function applyTheme(t){
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    var btn = document.getElementById("themeToggle");
    if(btn) btn.innerHTML = THEME_ICONS[t] + "<span>" + THEME_LABELS[t] + "</span>";
  }
  function setTheme(t){
    try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
    applyTheme(t);
  }
  function cycleTheme(){
    var order = ["system","light","dark"];
    var next = order[(order.indexOf(getTheme())+1) % order.length];
    setTheme(next);
  }

  /* ---------- csv helpers ---------- */
  function parseCSV(text){
    text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    var rows=[], row=[], field="", inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){
        if(c=='"'){
          if(text[i+1]=='"'){ field+='"'; i++; } else inQ=false;
        } else field+=c;
      } else {
        if(c=='"') inQ=true;
        else if(c==','){ row.push(field); field=""; }
        else if(c=='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else field+=c;
      }
    }
    if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(f){ return f.trim()!==""; }); });
  }
  function toCSV(rows){
    return rows.map(function(r){
      return r.map(function(f){
        f = f===undefined||f===null ? "" : String(f);
        if(/[",\n]/.test(f)) return '"'+f.replace(/"/g,'""')+'"';
        return f;
      }).join(",");
    }).join("\r\n");
  }
  function toTSV(rows){
    return rows.map(function(r){
      return r.map(function(f){ return f===undefined||f===null ? "" : String(f).replace(/[\t\r\n]/g," "); }).join("\t");
    }).join("\n");
  }

  /* ---------- 파일 저장 ----------
     이 페이지가 claude.ai 안에서 열리면 브라우저 저장이 막히므로,
     뷰어가 제공하는 저장 기능을 먼저 쓰고 안 되면 형식을 바꿔가며 다시 시도합니다. */
  var downloadsPromise = null;
  function getDownloads(){
    if(!downloadsPromise){
      var api = null;
      try{
        if(window.claude && typeof window.claude.use === "function") api = window.claude.use("downloads");
      }catch(e){ api = null; }
      downloadsPromise = Promise.resolve(api).catch(function(){ return null; });
    }
    return downloadsPromise;
  }
  function browserSave(filename, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  /* candidates: [{filename, data, blob, note}] — 앞에서부터 저장되는 형식을 찾습니다 */
  function deliverFile(candidates, notify){
    notify = notify || function(){};
    return getDownloads().then(function(d){
      var first = candidates[0];
      if(!d){
        browserSave(first.filename, first.blob || new Blob([first.data]));
        return;
      }
      function attempt(i){
        var c = candidates[i];
        if(!c){ notify("파일을 저장하지 못했습니다. '표 복사'를 눌러 엑셀이나 구글 시트에 붙여넣어 주세요.", "error"); return; }
        return d.save({ filename: c.filename, data: c.data }).then(function(){
          notify(c.note || ("'" + c.filename + "' 저장했습니다."), "ok");
        }, function(err){
          var code = (err && err.code) || "unavailable";
          if(code === "declined") return;
          if(code === "rate_limited"){ notify("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러주세요.", "warning"); return; }
          return attempt(i+1);
        });
      }
      return attempt(0);
    });
  }
  function copyText(text, notify, onFail){
    function done(ok){
      if(ok) notify("복사했습니다. 엑셀이나 구글 시트에 붙여넣으세요.", "ok");
      else if(onFail) onFail();
      else notify("복사하지 못했습니다.", "error");
    }
    function legacyCopy(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      ta.remove();
      done(ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, legacyCopy);
      return;
    }
    legacyCopy();
  }

  /* 버튼 옆에 바로 뜨는 안내 - 이 화면에서는 alert() 창이 뜨지 않을 수 있어 직접 그립니다 */
  function showInlineMsg(container, text, kind){
    var old = container.querySelector(":scope > .inline-msg");
    if(old) old.remove();
    var box = el("div", {class:"msg inline-msg " + (kind || "error")}, [text]);
    container.appendChild(box);
    if(box.scrollIntoView) box.scrollIntoView({block:"nearest"});
    return box;
  }

  /* 저장 + 복사 버튼 묶음. rows()는 2차원 배열을 돌려주는 함수입니다. */
  function buildExportRow(opts){
    var box = el("div", {class:"export-row"});
    var msg = el("div", {});
    function notify(text, kind){
      msg.innerHTML = "";
      msg.appendChild(el("div", {class:"msg " + (kind || "ok")}, [text]));
    }
    function showTextFallback(){
      msg.innerHTML = "";
      msg.appendChild(el("div", {class:"msg warning"}, ["자동 복사가 막혀 있습니다. 아래 내용을 직접 선택해 복사해주세요."]));
      var ta = el("textarea", {rows:"6", readonly:"readonly", style:"margin-top:8px;font-family:monospace;font-size:0.78rem;"});
      ta.value = toTSV(opts.rows());
      msg.appendChild(ta);
      ta.focus(); ta.select();
    }

    var saveBtn = el("button", {class:"btn small", type:"button", onclick:function(){
      var rows = opts.rows();
      var csv = "﻿" + toCSV(rows);
      notify("저장 중…", "info");
      buildXlsxBlob(opts.sheetName || "시트1", rows).then(function(blob){
        return deliverFile([
          { filename: opts.filename + ".xlsx", data: blob, blob: blob },
          { filename: opts.filename + ".csv", data: csv,
            blob: new Blob([csv], {type:"text/csv;charset=utf-8;"}),
            note: "이 화면에서는 엑셀 파일 저장이 지원되지 않아 CSV로 저장했습니다. 엑셀·구글 시트에서 그대로 열립니다." },
          { filename: opts.filename + ".txt", data: csv,
            note: "형식 제한으로 텍스트 파일(.txt)로 저장했습니다. 확장자를 .csv로 바꾸면 엑셀에서 열 수 있어요." }
        ], notify);
      }).catch(function(){
        notify("파일을 만들지 못했습니다. '표 복사'를 이용해주세요.", "error");
      });
    }}, ["⬇ " + (opts.label || "파일로 저장")]);

    var copyBtn = el("button", {class:"btn ghost small", type:"button", onclick:function(){
      copyText(toTSV(opts.rows()), notify, showTextFallback);
    }}, ["⧉ 표 복사"]);

    box.appendChild(saveBtn);
    box.appendChild(copyBtn);
    if(opts.hint) box.appendChild(el("span", {class:"export-hint"}, [opts.hint]));
    var wrap = el("div", {style:"margin-bottom:12px;"});
    wrap.appendChild(box);
    wrap.appendChild(msg);
    return wrap;
  }

  /* ---------- xlsx (excel) writer: minimal zip + xml builder, no external libraries ---------- */
  var ZIP_CRC_TABLE = null;
  function zipCrc32(bytes){
    if(!ZIP_CRC_TABLE){
      ZIP_CRC_TABLE = [];
      for(var n=0;n<256;n++){
        var c = n;
        for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        ZIP_CRC_TABLE[n] = c >>> 0;
      }
    }
    var c = 0xFFFFFFFF;
    for(var i=0;i<bytes.length;i++) c = ZIP_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zipDeflateRaw(bytes){
    var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function(buf){ return new Uint8Array(buf); });
  }
  function zipU16(n){ return [n & 0xFF, (n>>>8)&0xFF]; }
  function zipU32(n){ return [n&0xFF, (n>>>8)&0xFF, (n>>>16)&0xFF, (n>>>24)&0xFF]; }

  function buildZipBlob(files){
    var enc = new TextEncoder();
    return Promise.all(files.map(function(f){
      var raw = enc.encode(f.content);
      return zipDeflateRaw(raw).then(function(compressed){
        return { name:f.name, raw:raw, compressed:compressed, crc: zipCrc32(raw) };
      });
    })).then(function(parts){
      var localParts = [], centralParts = [], offset = 0;
      parts.forEach(function(p){
        var nameBytes = Array.from(enc.encode(p.name));
        var localHeader = new Uint8Array([].concat(
          zipU32(0x04034b50), zipU16(20), zipU16(0), zipU16(8), zipU16(0), zipU16(0),
          zipU32(p.crc), zipU32(p.compressed.length), zipU32(p.raw.length),
          zipU16(nameBytes.length), zipU16(0), nameBytes
        ));
        localParts.push(localHeader, p.compressed);
        centralParts.push(new Uint8Array([].concat(
          zipU32(0x02014b50), zipU16(20), zipU16(20), zipU16(0), zipU16(8), zipU16(0), zipU16(0),
          zipU32(p.crc), zipU32(p.compressed.length), zipU32(p.raw.length),
          zipU16(nameBytes.length), zipU16(0), zipU16(0), zipU16(0), zipU16(0), zipU32(0),
          zipU32(offset), nameBytes
        )));
        offset += localHeader.length + p.compressed.length;
      });
      var centralStart = offset;
      var centralSize = centralParts.reduce(function(a,p){ return a+p.length; }, 0);
      var eocd = new Uint8Array([].concat(
        zipU32(0x06054b50), zipU16(0), zipU16(0), zipU16(parts.length), zipU16(parts.length),
        zipU32(centralSize), zipU32(centralStart), zipU16(0)
      ));
      var allParts = localParts.concat(centralParts, [eocd]);
      var totalLen = allParts.reduce(function(a,p){ return a+p.length; }, 0);
      var out = new Uint8Array(totalLen);
      var pos = 0;
      allParts.forEach(function(p){ out.set(p,pos); pos += p.length; });
      return new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    });
  }

  function colIndexToLetters(idx){
    var s = "", n = idx + 1;
    while(n > 0){
      var rem = (n-1) % 26;
      s = String.fromCharCode(65+rem) + s;
      n = Math.floor((n-1)/26);
    }
    return s;
  }
  function xmlEscape(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function buildXlsxBlob(sheetName, rows){
    function cellXml(colIdx, rowIdx, value){
      var ref = colIndexToLetters(colIdx) + rowIdx;
      if(typeof value === "number" && isFinite(value)) return '<c r="'+ref+'"><v>'+value+'</v></c>';
      var text = value===undefined||value===null ? "" : String(value);
      if(text === "") return '<c r="'+ref+'"/>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(text)+'</t></is></c>';
    }
    var rowsXml = rows.map(function(r, rIdx){
      var cells = r.map(function(v, cIdx){ return cellXml(cIdx, rIdx+1, v); }).join("");
      return '<row r="'+(rIdx+1)+'">'+cells+'</row>';
    }).join("");
    var sheetXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rowsXml+'</sheetData></worksheet>';
    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';
    var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    var workbookXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xmlEscape(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
    var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';
    return buildZipBlob([
      {name:"[Content_Types].xml", content: contentTypes},
      {name:"_rels/.rels", content: rootRels},
      {name:"xl/workbook.xml", content: workbookXml},
      {name:"xl/_rels/workbook.xml.rels", content: workbookRels},
      {name:"xl/worksheets/sheet1.xml", content: sheetXml}
    ]);
  }

  function readFileSmart(file){
    return file.arrayBuffer().then(function(buf){
      var text = new TextDecoder("utf-8", {fatal:false}).decode(buf);
      if(text.indexOf(String.fromCharCode(0xFFFD)) !== -1){
        try{ text = new TextDecoder("euc-kr").decode(buf); }catch(e){}
      }
      if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
      return text;
    });
  }

  /* ---------- xlsx (excel) support: minimal zip + xml reader, no external libraries ---------- */
  function isExcelFilename(name){
    return /\.(xlsx|xlsm)$/i.test(name || "");
  }

  function colLettersToIndex(letters){
    var n = 0;
    for(var i=0;i<letters.length;i++) n = n*26 + (letters.charCodeAt(i) - 64);
    return n - 1;
  }

  function rowColFromRef(ref){
    var m = /^([A-Z]+)(\d+)$/.exec(ref || "");
    if(!m) return null;
    return { col: colLettersToIndex(m[1]), row: parseInt(m[2],10) };
  }

  function readZipCentralDirectory(bytes){
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var eocdSig = 0x06054b50;
    var pos = -1;
    var minPos = Math.max(0, bytes.length - 65557);
    for(var i=bytes.length-22; i>=minPos; i--){
      if(view.getUint32(i, true) === eocdSig){ pos = i; break; }
    }
    if(pos === -1) throw new Error("올바른 엑셀 파일이 아닙니다.");
    var cdOffset = view.getUint32(pos+16, true);
    var entryCount = view.getUint16(pos+10, true);
    var entries = {};
    var p = cdOffset;
    for(var e=0; e<entryCount; e++){
      var sig = view.getUint32(p, true);
      if(sig !== 0x02014b50) break;
      var method = view.getUint16(p+10, true);
      var compSize = view.getUint32(p+20, true);
      var nameLen = view.getUint16(p+28, true);
      var extraLen = view.getUint16(p+30, true);
      var commentLen = view.getUint16(p+32, true);
      var localOffset = view.getUint32(p+42, true);
      var nameBytes = bytes.subarray(p+46, p+46+nameLen);
      var name = new TextDecoder("utf-8").decode(nameBytes);
      entries[name] = { method: method, compSize: compSize, localOffset: localOffset };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function extractZipEntry(bytes, meta){
    var view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var p = meta.localOffset;
    var sig = view.getUint32(p, true);
    if(sig !== 0x04034b50) return Promise.reject(new Error("압축 파일 구조를 읽지 못했습니다."));
    var nameLen = view.getUint16(p+26, true);
    var extraLen = view.getUint16(p+28, true);
    var dataStart = p + 30 + nameLen + extraLen;
    var compressed = bytes.subarray(dataStart, dataStart + meta.compSize);
    if(meta.method === 0) return Promise.resolve(compressed);
    if(meta.method === 8){
      if(typeof DecompressionStream === "undefined"){
        return Promise.reject(new Error("이 브라우저는 엑셀 파일을 직접 여는 기능을 지원하지 않습니다. CSV로 저장해서 업로드해주세요."));
      }
      var stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(stream).arrayBuffer().then(function(buf){ return new Uint8Array(buf); });
    }
    return Promise.reject(new Error("지원하지 않는 압축 방식입니다."));
  }

  function parseSharedStringsXml(xmlText){
    if(!xmlText) return [];
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    var siList = doc.getElementsByTagName("si");
    var out = [];
    for(var i=0;i<siList.length;i++){
      var tNodes = siList[i].getElementsByTagName("t");
      var text = "";
      for(var j=0;j<tNodes.length;j++) text += tNodes[j].textContent;
      out.push(text);
    }
    return out;
  }

  function parseWorkbookSheetOrder(workbookXmlText, relsXmlText){
    var wbDoc = new DOMParser().parseFromString(workbookXmlText, "application/xml");
    var relMap = {};
    if(relsXmlText){
      var relsDoc = new DOMParser().parseFromString(relsXmlText, "application/xml");
      var rels = relsDoc.getElementsByTagName("Relationship");
      for(var i=0;i<rels.length;i++) relMap[rels[i].getAttribute("Id")] = rels[i].getAttribute("Target");
    }
    var sheetNodes = wbDoc.getElementsByTagName("sheet");
    var list = [];
    for(var k=0;k<sheetNodes.length;k++){
      var node = sheetNodes[k];
      var rid = node.getAttribute("r:id") ||
        node.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
      var target = (relMap[rid] || "").replace(/^\/?xl\//, "").replace(/^\.?\//, "");
      list.push({ name: node.getAttribute("name") || ("Sheet"+(k+1)), target: "xl/" + target });
    }
    return list;
  }

  function parseSheetXmlToRows(xmlText, sharedStrings){
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    var rowNodes = doc.getElementsByTagName("row");
    var rows = [];
    for(var i=0;i<rowNodes.length;i++){
      var rowNode = rowNodes[i];
      var rIdx = parseInt(rowNode.getAttribute("r"), 10) || (i+1);
      var arr = rows[rIdx-1] || [];
      var cellNodes = rowNode.getElementsByTagName("c");
      for(var j=0;j<cellNodes.length;j++){
        var c = cellNodes[j];
        var ref = c.getAttribute("r");
        var pos = ref ? rowColFromRef(ref) : null;
        var colIdx = pos ? pos.col : j;
        var type = c.getAttribute("t");
        var value = "";
        if(type === "inlineStr"){
          var isNode = c.getElementsByTagName("is")[0];
          if(isNode){
            var tNodes = isNode.getElementsByTagName("t");
            for(var tI=0; tI<tNodes.length; tI++) value += tNodes[tI].textContent;
          }
        } else {
          var vNode = c.getElementsByTagName("v")[0];
          var raw = vNode ? vNode.textContent : "";
          if(type === "s"){
            var idx = parseInt(raw, 10);
            value = (!isNaN(idx) && sharedStrings[idx] !== undefined) ? sharedStrings[idx] : "";
          } else if(type === "b"){
            value = raw === "1" ? "TRUE" : "FALSE";
          } else if(type === "str" || type === "e"){
            value = raw;
          } else {
            // 숫자 칸은 "4.0", "20.0" 처럼 저장되는 경우가 있어 "4", "20"으로 맞춥니다.
            var numVal = Number(raw);
            value = (raw !== "" && isFinite(numVal)) ? String(numVal) : raw;
          }
        }
        arr[colIdx] = value;
      }
      rows[rIdx-1] = arr;
    }
    var normalized = rows.map(function(r){
      return r ? r.map(function(v){ return v===undefined||v===null ? "" : String(v); }) : [];
    });
    return normalized.filter(function(r){ return r.some(function(f){ return f.trim()!==""; }); });
  }

  function parseXLSXFile(file){
    return file.arrayBuffer().then(function(buf){
      var bytes = new Uint8Array(buf);
      var entries = readZipCentralDirectory(bytes);
      if(!entries["xl/workbook.xml"]) throw new Error("올바른 엑셀 파일이 아닙니다.");

      function textOf(name){
        if(!entries[name]) return Promise.resolve("");
        return extractZipEntry(bytes, entries[name]).then(function(data){
          return new TextDecoder("utf-8").decode(data);
        });
      }

      return Promise.all([
        textOf("xl/workbook.xml"),
        textOf("xl/_rels/workbook.xml.rels"),
        textOf("xl/sharedStrings.xml")
      ]).then(function(results){
        var workbookXml = results[0], relsXml = results[1], sharedStringsXml = results[2];
        var sharedStrings = parseSharedStringsXml(sharedStringsXml);
        var sheetList = parseWorkbookSheetOrder(workbookXml, relsXml);
        if(!sheetList.length) throw new Error("시트를 찾을 수 없습니다.");
        return sheetList.reduce(function(chain, sheetInfo){
          return chain.then(function(acc){
            if(!entries[sheetInfo.target]) return acc;
            return textOf(sheetInfo.target).then(function(sheetXml){
              acc.push({ name: sheetInfo.name, rows: parseSheetXmlToRows(sheetXml, sharedStrings) });
              return acc;
            });
          });
        }, Promise.resolve([]));
      });
    });
  }

  function renderSheetPicker(container, sheets, onPick){

  /* 시트가 여러 개여도 내용상 맞는 시트가 하나뿐이면 묻지 않고 그 시트를 씁니다 */
  function chooseSheet(status, sheets, detect, onPick){
    if(sheets.length === 1){ onPick(sheets[0].rows); return; }
    var matches = sheets.filter(function(s){ return detect(s); });
    if(matches.length === 1){ onPick(matches[0].rows); return; }
    renderSheetPicker(status, matches.length ? matches : sheets, onPick);
  }

  /* 통합 불러오기에서 학생 답안이 있는 시트가 여러 개 발견됐을 때 어느 시트를 쓸지 고르게 합니다 */
  function renderWorkbookSheetPicker(container, answerSheets, onPick){
    container.innerHTML = "";
    container.appendChild(el("div", {class:"msg warning"}, [
      "학생 답안이 있는 시트가 " + answerSheets.length + "개 있습니다. 불러올 시트를 선택해주세요."
    ]));
    var select = el("select", {style:"margin-bottom:8px;"});
    answerSheets.forEach(function(s, i){
      var opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = s.sheetName + " (학생 " + s.students.length + "명, " + s.qCount + "문항)";

    container.appendChild(el("button", {class:"btn small", type:"button", onclick:function(){
      onPick(answerSheets[Number(select.value)]);
    }}, ["이 시트로 가져오기"]));

  /* ---------- 통합 불러오기: 시트 한 개(또는 통합문서 전체)에서 문항 수·정답·학생 답안을 한 번에 읽습니다 ---------- */
  var RE_NAME     = /^\s*(이름|성명|학생\s*이름|학생명|name)\s*$/i;
  var RE_NO       = /^\s*(번호|학번|출석번호|no\.?|number|번)\s*$/i;
  var RE_QCOL     = /^\s*(?:(?:문항|문제|Q)\s*)?(\d{1,3})\s*(?:번|번째|문항)?\s*$/i;
  var RE_IGNORE   = /제출|타임스탬프|timestamp|이메일|e-?mail|점수|총점|합계|비고|메모|학교|학년|반$/i;
  var RE_KEYROW   = /^\s*(정답|정답지|답안|answer\s*key|key)\s*$/i;
  var RE_SCOREROW = /^\s*(배점|점수배점|score)\s*$/i;

  function findHeaderRow(rows){
    var limit = Math.min(rows.length, 12);
    for(var i=0;i<limit;i++){
      var r = rows[i] || [];
      for(var j=0;j<r.length;j++) if(RE_NAME.test(r[j] || "")) return i;
    }
    return -1;
  }

  /* 학생 답안 시트: 번호 | 이름 | 1 | 2 | … | 제출시각 */
  function analyzeAnswerSheet(sheet){
    var rows = sheet.rows || [];
    var h = findHeaderRow(rows);
    if(h < 0) return null;
    var header = rows[h] || [];
    var nameCol = -1, numCol = -1, qCols = [];
    header.forEach(function(cell, j){
      var t = (cell || "").trim();
      if(nameCol < 0 && RE_NAME.test(t)){ nameCol = j; return; }
      if(numCol < 0 && RE_NO.test(t)){ numCol = j; return; }
      if(RE_QCOL.test(t)) qCols.push(j);
    });
    if(nameCol < 0) return null;
    if(!qCols.length){
      header.forEach(function(cell, j){
        var t = (cell || "").trim();
        if(j === nameCol || j === numCol || !t || RE_IGNORE.test(t)) return;
        qCols.push(j);
      });
    }
    if(!qCols.length) return null;

    var students = [], keyRow = null, scoreRow = null, typeRow = null;
    for(var i=h+1;i<rows.length;i++){
      var r = rows[i] || [];
      var name = (r[nameCol] || "").trim();
      var num = numCol >= 0 ? (r[numCol] || "").trim() : "";
      var answers = qCols.map(function(c){ return (r[c] || "").trim(); });
      var tag = name || num;
      if(RE_KEYROW.test(tag)){ if(answers.some(Boolean)) keyRow = answers; continue; }
      if(RE_SCOREROW.test(tag)){ if(answers.some(Boolean)) scoreRow = answers; continue; }
      if(/^\s*(유형|형식)\s*$/.test(tag)){ if(answers.some(Boolean)) typeRow = answers; continue; }
      if(!name) continue;
      students.push({ num: num, name: name, answers: answers });
    }
    return { sheetName: sheet.name, qCount: qCols.length, students: students, keyRow: keyRow, scoreRow: scoreRow, typeRow: typeRow };
  }

  /* 정답지 시트: 문항 | 유형 | 정답 | 배점 (한 줄에 한 문항) */
  var RE_KEY_HEADER_CELL = /^\s*(문항|문제|번호|학번|유형|형식|정답|답|배점|점수|비고|메모)/;
  function analyzeKeySheet(sheet){
    var rows = sheet.rows || [];
    var limit = Math.min(rows.length, 12);
    for(var i=0;i<limit;i++){
      var r = rows[i] || [];
      // 머리글로 보이는 줄만 후보로 삼습니다 - 학생 시트 안의 '정답' 행을 잘못 잡지 않도록.
      var looksLikeHeader = r.filter(function(c){ return (c || "").trim(); })
        .every(function(c){ return RE_KEY_HEADER_CELL.test(c.trim()); });
      if(!looksLikeHeader) continue;
      var ansCol = -1, typeCol = -1, scoreCol = -1;
      r.forEach(function(cell, j){
        var t = (cell || "").trim();
        if(ansCol < 0 && /^정답/.test(t) && !/수$/.test(t)) ansCol = j;
        else if(typeCol < 0 && /유형|형식/.test(t)) typeCol = j;
        else if(scoreCol < 0 && /^(배점|점수)$/.test(t)) scoreCol = j;
      });
      if(ansCol < 0) continue;
      var items = [];
      for(var k=i+1;k<rows.length;k++){
        var rr = rows[k] || [];
        var a = (rr[ansCol] || "").trim();
        if(!a) continue;
        items.push({
          answer: a,
          type: (typeCol >= 0 && /단답|서술|주관/.test(rr[typeCol] || "")) ? "short" : "mc",
          score: scoreCol >= 0 ? (Number(rr[scoreCol]) || 0) : 0
        });
      }
      if(items.length) return items;
    }
    return null;
  }

  /* '설정' 시트처럼 라벨 아래(또는 오른쪽) 칸에 값이 있는 경우를 읽습니다 */
  function labeledValue(sheets, re){
    for(var s=0;s<sheets.length;s++){
      var rows = sheets[s].rows || [];
      for(var i=0;i<rows.length;i++){
        var r = rows[i] || [];
        for(var j=0;j<r.length;j++){
          if(!re.test((r[j] || "").trim())) continue;
          var below = ((rows[i+1] || [])[j] || "").trim();
          if(below) return below;
          var right = (r[j+1] || "").trim();
          if(right) return right;
        }
      }
    }
    return "";
  }

  /* 엑셀이든 CSV든 같은 모양 [{name, rows}] 으로 읽어옵니다 */
  function loadSheets(file){
    if(/\.xls$/i.test(file.name || "")){
      return Promise.reject(new Error("예전 형식(.xls)은 읽을 수 없습니다. 엑셀에서 'Excel 통합 문서(.xlsx)'로 저장한 뒤 올려주세요."));
    }
    if(isExcelFilename(file.name)) return parseXLSXFile(file);
    return readFileSmart(file).then(function(text){
      return [{ name: (file.name || "CSV").replace(/\.[^.]+$/, ""), rows: parseCSV(text) }];
    });
  }

  /* 통합문서를 훑어서 학생 답안 시트 / 정답만 있는 시트 / 정답지 시트 후보를 나눕니다 (상태는 건드리지 않습니다) */
  function analyzeWorkbookCandidates(sheets){
    var answerSheets = [], keyOnlySheets = [], keySheets = [];
    sheets.forEach(function(sh){
      var a = analyzeAnswerSheet(sh);
      if(a && a.students.length){ answerSheets.push(a); return; }  // 학생 시트는 정답지로 다시 읽지 않습니다
      if(a && (a.keyRow || a.scoreRow || a.typeRow)){ keyOnlySheets.push(a); return; }  // 학생 행 없이 정답만 있는 시트
      var k = analyzeKeySheet(sh);
      if(k) keySheets.push(k);
    });
    if(!answerSheets.length && !keyOnlySheets.length && !keySheets.length){
      throw new Error("학생 답안이나 정답을 찾지 못했습니다. 머리글 행에 '이름'이 있고 1, 2, 3… 문항 번호 열이 있어야 합니다.");
    }
    answerSheets.sort(function(a,b){ return (b.students.length - a.students.length) || (b.qCount - a.qCount); });
    return { answerSheets: answerSheets, keyOnlySheets: keyOnlySheets, keySheets: keySheets };
  }

  /* 고른(또는 유일한) 학생 답안 시트를 기준으로 상태에 반영하고, 정답까지 있으면 채점 결과로 넘어갑니다 */
  function applyWorkbookImport(sheets, best, keySheets, keyOnlySheets){
    var title = labeledValue(sheets, /^\s*(평가명|시험명|평가\s*이름|제목)\s*$/);
    var settingCount = parseInt(labeledValue(sheets, /^\s*(문항수|문항\s*수|총\s*문항)\s*$/), 10);
    var n = best.qCount || (isFinite(settingCount) ? settingCount : 0);
    if(!n) throw new Error("문항 수를 알 수 없습니다. 머리글에 1, 2, 3… 문항 번호를 넣어주세요.");

    // 학생 답안 시트를 실제로 골랐다면 그 시트 이름이 우선입니다 ('설정' 시트는 평가마다
    // 한 행씩이라 라벨-값 방식으로 아무 값이나 집어오면 다른 평가 이름이 붙을 수 있습니다).
    // 정답지만 올린 경우에만 '설정' 시트의 값을 보조로 씁니다.
    state.examTitle = best.students.length ? (best.sheetName || title || "") : (title || state.examTitle || "");
    state.numQuestions = Math.max(1, Math.min(n, 200));

    var keyItems = keySheets.length ? keySheets[0] : null;
    var keyScores = (keyItems && keyItems.some(function(it){ return it.score > 0; }))
      ? keyItems.map(function(it){ return it.score; })
      : ((best.scoreRow && best.scoreRow.some(function(v){ return Number(v) > 0; }))
          ? best.scoreRow.map(function(v){ return Number(v) || 0; })
          : null);
    state.customScoring = !!keyScores;
    state.questions = [];
    ensureQuestions();

    var keyAnswers = keyItems ? keyItems.map(function(it){ return it.answer; }) : best.keyRow;
    if(keyAnswers){
      state.questions.forEach(function(q, i){
        if(keyAnswers[i]) q.answer = keyAnswers[i];
        if(keyItems && keyItems[i]) q.type = keyItems[i].type;
      });
    }
    if(keyScores) state.questions.forEach(function(q, i){ q.score = Number(keyScores[i]) || 0; });
    if(best.typeRow){
      state.questions.forEach(function(q, i){
        if(best.typeRow[i]) q.type = /단답|서술|주관/.test(best.typeRow[i]) ? "short" : "mc";
      });
    }

    state.students = best.students.map(function(s){ return { num:s.num, name:s.name, answers:s.answers.slice() }; });
    ensureStudentAnswerLength();

    var hasKey = state.questions.every(function(q){ return q.answer && q.answer.trim(); });
    var hasStudents = state.students.length > 0;
    state.step = (hasKey && hasStudents) ? 4 : (hasKey ? 3 : 2);
    state.qInputMode = "manual";
    state.sInputMode = "manual";
    save();
    return { students: state.students.length, questions: state.numQuestions, hasKey: hasKey, title: state.examTitle };
  }

  /* ---------- dom helpers ---------- */
  function el(tag, attrs, children){
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==="class") n.className = attrs[k];
      else if(k==="html") n.innerHTML = attrs[k];
      else if(k.indexOf("on")===0 && typeof attrs[k]==="function") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c===null||c===undefined) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }
  function fmt1(x){ return (Math.round(x*10)/10).toString(); }
  function clampPct(x){ return Math.max(0, Math.min(100, x)); }

  /* ---------- one-shot import notice (shown once right after a successful upload) ---------- */
  var importNotice = null;
  function consumeImportNotice(card){
    if(!importNotice) return;
    card.appendChild(el("div", {class:"msg ok", style:"margin-bottom:14px;"}, ["✅ " + importNotice]));
    importNotice = null;
  }

  /* ---------- stepper ---------- */
  var STEP_LABELS = ["문항 설정","정답 입력","학생 답안 입력","분석 결과"];
  function renderStepper(){
    var nav = document.getElementById("stepper");
    nav.innerHTML = "";
    STEP_LABELS.forEach(function(label, i){
      var n = i+1;
      var cls = "step-tab" + (state.step===n ? " active" : (n<state.step ? " done" : ""));
      var disabled = n > state.step;
      var attrs = {
        class: cls,
        type: "button",
        onclick: function(){ if(n<=state.step){ state.step = n; renderAll(); } }
      };
      if(disabled) attrs.disabled = "disabled";
      var btn = el("button", attrs, [
        el("span", {class:"num"}, [String(n)]),
        el("span", {class:"label"}, [label])
      ]);
      nav.appendChild(btn);
    });
  }

  /* ---------- STEP 1 ---------- */
  function renderStep1(){
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    panel.appendChild(buildQuickImportCard());

    var card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["직접 설정하기"]));
    card.appendChild(el("p", {class:"hint"}, ["파일 없이 시작할 때는 문항 수와 배점 방식을 정해주세요. 다음 단계에서 문항별 정답과 배점을 입력하게 됩니다."]));

    var qField = el("label", {class:"field", style:"margin-bottom:22px;"}, ["총 문항 수"]);
    var qInput = el("input", {type:"number", min:"1", max:"200", value:String(state.numQuestions), style:"max-width:120px;"});
    qField.appendChild(qInput);
    card.appendChild(qField);

    var swField = el("div", {class:"field"}, ["배점 방식"]);
    var scoringTabs = el("div", {class:"tabs", style:"margin:8px 0 0;"});
    [
      { key:false, label:"모든 문항 동일 배점" },
      { key:true, label:"문항별로 다르게 설정" }
    ].forEach(function(opt){
      var b = el("button", {
        class: "tab-btn" + (state.customScoring===opt.key ? " active" : ""),
        type: "button",
        onclick: function(){
          if(state.customScoring === opt.key) return;
          state.customScoring = opt.key;
          ensureQuestions(); save();
          renderStep1();
        }
      }, [opt.label]);
      scoringTabs.appendChild(b);
    });
    swField.appendChild(scoringTabs);
    swField.appendChild(el("p", {class:"hint", style:"margin:8px 0 0;"}, [

  function buildGoogleCsvHelper(){
    var box = el("div", {class:"gsheet-box"});
    box.appendChild(el("div", {class:"gsheet-label"}, ["구글 시트에서 파일 내보내기"]));
    var row = el("div", {class:"gsheet-row"});
    var input = el("input", {type:"text", placeholder:"구글 시트 링크를 붙여넣으세요"});
    var msg = el("div", {});

    // 새 창을 코드로 여는 방식은 이 화면에서 막힐 수 있어, 눌러서 여는 링크로 만들어 줍니다.
    function makeExport(){
      var url = input.value.trim();
      msg.innerHTML = "";
      if(!url) return;
      var idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if(!idMatch){
        msg.appendChild(el("div", {class:"msg error"}, ["올바른 구글 시트 링크를 입력해주세요. 주소창의 https://docs.google.com/spreadsheets/d/… 링크를 그대로 붙여넣으면 됩니다."]));
        return;
      }
      var gidMatch = url.match(/[?#&]gid=([0-9]+)/);
      function link(format, label){
        var href = "https://docs.google.com/spreadsheets/d/" + idMatch[1] + "/export?format=" + format + (gidMatch ? ("&gid="+gidMatch[1]) : "");
        return el("a", {class:"btn small", href:href, target:"_blank", rel:"noopener noreferrer", style:"text-decoration:none;display:inline-block;"}, [label]);
      }
      var links = el("div", {class:"gsheet-row", style:"margin-top:8px;"}, [
        link("xlsx", "⬇ 엑셀(.xlsx)로 내려받기"),
        link("csv", "⬇ 현재 탭 CSV로 내려받기")
      ]);
      msg.appendChild(links);
      msg.appendChild(el("div", {class:"msg ok"}, ["링크를 누르면 파일이 내려받아집니다. 그 파일을 아래 영역에 그대로 올려주세요. 엑셀(.xlsx)로 받으면 시트 전체가 들어 있습니다."]));
    }

    input.addEventListener("input", makeExport);
    var makeBtn = el("button", {class:"btn small", type:"button", onclick:makeExport}, ["내려받기 링크 만들기"]);
    row.appendChild(input);
    row.appendChild(makeBtn);
    box.appendChild(row);
    box.appendChild(msg);
    return box;
  }

  function templateHeader(){

  function buildAnswerKeyUpload(){
    var box = el("div", {});
    box.appendChild(buildExportRow({
      label: "정답지 양식 저장",
      filename: "정답지_양식",
      sheetName: "정답지",
      hint: "빈 양식을 받아 정답을 채운 뒤 다시 올리면 됩니다.",
      rows: answerKeyTemplateRows
    }));
    box.appendChild(buildGoogleCsvHelper());

    var dz = el("div", {class:"dropzone", tabindex:"0"}, [
      el("div", {}, [el("strong",{},["클릭하여 엑셀/CSV 파일 선택"]), " 또는 이 영역에 파일을 끌어다 놓으세요"]),
      el("div", {style:"font-size:0.76rem;margin-top:6px;color:var(--text-3);"}, ["엑셀(.xlsx) 또는 CSV(.csv) 파일을 변환 없이 그대로 올리면 됩니다. 열 순서가 달라도 번호·이름·문항 번호 머리글만 있으면 찾아 씁니다. 이름 칸이 '정답'·'배점'·'유형'인 행은 학생이 아니라 정답·배점·유형으로 읽습니다."])
    ]);
    var fileInput = el("input", {type:"file", accept:".csv,.xlsx,.xlsm,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", style:"display:none;"});
    var status = el("div", {});
    dz.appendChild(status);
    dz.addEventListener("click", function(e){ if(status.contains(e.target)) return; fileInput.click(); });
    dz.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" ") fileInput.click(); });
    ["dragover"].forEach(function(evt){ dz.addEventListener(evt, function(e){ e.preventDefault(); dz.style.borderColor = "var(--accent)"; }); });
    ["dragleave","drop"].forEach(function(evt){ dz.addEventListener(evt, function(e){ e.preventDefault(); dz.style.borderColor = ""; }); });
    dz.addEventListener("drop", function(e){
      if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener("change", function(){
      if(fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function finalizeImport(rows){
      if(!rows.length){ showMsg("파일에서 데이터를 찾지 못했습니다.", true); return; }
      var headerRow = rows[0];
      var hasHeader = /문항|번호|유형|정답|배점|type|no/i.test(headerRow.join(""));
      var dataRows = hasHeader ? rows.slice(1) : rows;
      if(!dataRows.length){ showMsg("정답 데이터가 없습니다.", true); return; }

      // 헤더 이름으로 열을 찾아서 씁니다 - 열 순서가 다르거나 다른 열이 섞여 있어도 됩니다.
      var col = { type:-1, answer:-1, score:-1 };
      if(hasHeader){
        headerRow.forEach(function(h,i){
          var t = (h||"").trim();
          if(col.type===-1 && /유형|type/i.test(t)) col.type = i;
          else if(col.answer===-1 && /^정답/.test(t)) col.answer = i;
          else if(col.score===-1 && /배점|점수|score/i.test(t)) col.score = i;
        });
      }
      if(col.type===-1) col.type = 1;
      if(col.answer===-1) col.answer = 2;
      if(col.score===-1) col.score = 3;

      var questions = dataRows.map(function(r,i){
        return {
          no: i+1,
          type: /단답/.test(r[col.type]||"") ? "short" : "mc",
          answer: (r[col.answer]||"").trim(),
          score: Number(r[col.score]) || 0
        };
      });
      state.numQuestions = questions.length;
      var hasCustomScores = questions.some(function(q){ return q.score>0; });
      state.customScoring = hasCustomScores;
      state.questions = questions;
      ensureQuestions();
      ensureStudentAnswerLength();
      state.qInputMode = "manual";
      importNotice = questions.length + "개 문항을 불러왔습니다. 아래에서 내용을 확인하세요.";
      save();
      renderStep2();
    }

    function handleFile(file){
      if(isExcelFilename(file.name)){
        parseXLSXFile(file).then(function(sheets){
          sheets = sheets.filter(function(s){ return s.rows.length; });
          if(!sheets.length){ showMsg("파일에서 데이터를 찾지 못했습니다.", true); return; }
          chooseSheet(status, sheets, function(s){ return !!analyzeKeySheet(s); }, finalizeImport);
        }).catch(function(err){ showMsg(err && err.message ? err.message : "엑셀 파일을 읽는 중 오류가 발생했습니다.", true); });
      } else {
        readFileSmart(file).then(function(text){
          var rows = parseCSV(text);
          if(!rows.length){ showMsg("파일에서 데이터를 찾지 못했습니다.", true); return; }
          finalizeImport(rows);
        }).catch(function(){ showMsg("파일을 읽는 중 오류가 발생했습니다.", true); });
      }
    }
    function showMsg(text, isError){
      status.innerHTML = "";
      status.appendChild(el("div", {class:"msg "+(isError?"error":"ok")}, [text]));
    }
    box.appendChild(dz);
    return box;
  }

    function finalizeImport(rows){

      // 머리글에서 문항 번호 열을 찾을 수 있으면 문항 수까지 시트에 맞춰 조정합니다.

        save();

        return;
      }

      var headerRow = rows[0];
      var hasHeader = /번호|이름|name/i.test(headerRow.join(""));
      var dataRows = hasHeader ? rows.slice(1) : rows;
      if(!dataRows.length){ showMsg("학생 데이터가 없습니다.", true); return; }

      // 헤더 이름/문항 번호로 열을 찾아서 씁니다 - 열 순서가 다르거나 제출시각 같은
      // 다른 열이 섞여 있어도 필요한 부분만 찾아 씁니다.
      var n = state.numQuestions;
      var numIdx = -1, nameIdx = -1, qMap = {};
      if(hasHeader){
        headerRow.forEach(function(h,i){
          var t = (h||"").trim();
          if(numIdx===-1 && /^(번호|no\.?|number)$/i.test(t)){ numIdx = i; return; }
          if(nameIdx===-1 && /^(이름|name)$/i.test(t)){ nameIdx = i; return; }
          if(/^\d+$/.test(t)) qMap[parseInt(t,10)] = i;
        });
      }
      if(numIdx===-1) numIdx = 0;
      if(nameIdx===-1) nameIdx = 1;
      var hasQMap = Object.keys(qMap).length > 0;

      var students = dataRows.map(function(r){
        var answers = [];
        for(var i=1;i<=n;i++){
          var srcIdx = hasQMap ? qMap[i] : (1 + i); // fallback: columns right after 이름, in order
          answers.push(srcIdx===undefined ? "" : (r[srcIdx]||"").trim());

        return { num:(r[numIdx]||"").trim(), name:(r[nameIdx]||"").trim(), answers: answers };
      }).filter(function(s){ return s.name; });

    function handleFile(file){

      } else {
        readFileSmart(file).then(function(text){
          var rows = parseCSV(text);
          if(!rows.length){ showMsg("파일에서 데이터를 찾지 못했습니다.", true); return; }
          finalizeImport(rows);
        }).catch(function(){ showMsg("파일을 읽는 중 오류가 발생했습니다.", true); });

  /* ---------- grading ---------- */
  /* 답 표기가 조금 달라도 같은 답으로 인정합니다.
     ①②③ 같은 동그라미 번호 → 1,2,3 / 전각 숫자 → 반각 / 띄어쓰기와 끝 문장부호는 무시 */
  var MARK_MAP = {
    "①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9","⑩":"10",
    "➀":"1","➁":"2","➂":"3","➃":"4","➄":"5","➅":"6","➆":"7","➇":"8","➈":"9","➉":"10",
    "❶":"1","❷":"2","❸":"3","❹":"4","❺":"5","❻":"6","❼":"7","❽":"8","❾":"9","❿":"10",
    "⑴":"1","⑵":"2","⑶":"3","⑷":"4","⑸":"5",
    "㉠":"ㄱ","㉡":"ㄴ","㉢":"ㄷ","㉣":"ㄹ","㉤":"ㅁ","㉥":"ㅂ",
    "ⓐ":"a","ⓑ":"b","ⓒ":"c","ⓓ":"d","ⓔ":"e"
  };
  function normalizeAnswer(v){
    var s = (v === undefined || v === null) ? "" : String(v);
    s = s.replace(/[！-～]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
    s = s.replace(/./g, function(ch){ return MARK_MAP[ch] || ch; });
    s = s.replace(/\s+/g, "");
    s = s.replace(/[.,·;:]+$/, "");
    return s.toLowerCase();
  }
  function acceptedAnswers(question){
    return String(question.answer || "").split("/").map(normalizeAnswer).filter(Boolean);
  }
  function isAccepted(question, given){
    var g = normalizeAnswer(given);
    if(!g) return false;
    return acceptedAnswers(question).indexOf(g) !== -1;
  }

  function gradeAll(){
    var validStudents = state.students.filter(function(s){ return s.name && s.name.trim(); });
    var results = validStudents.map(function(s){
      var score = 0, correctCount = 0;
      var detail = state.questions.map(function(q, i){
        var given = (s.answers[i]||"").trim();
        var correct = isAccepted(q, given);
        if(correct){ score += Number(q.score)||0; correctCount++; }
        return { no:q.no, given: given, correct: correct };
      });
      return { num:s.num||"-", name:s.name, score:score, correctCount:correctCount, total: state.questions.length, detail: detail };
    });
    return results;
  }

  function mean(arr){ return arr.length ? arr.reduce(function(a,b){return a+b;},0)/arr.length : 0; }
  function stdev(arr){
    if(arr.length<2) return 0;
    var m = mean(arr);
    var v = mean(arr.map(function(x){ return (x-m)*(x-m); }));
    return Math.sqrt(v);
  }
  function median(arr){
    if(!arr.length) return 0;
    var s = arr.slice().sort(function(a,b){return a-b;});
    var mid = Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }

  function questionStats(results){
    return state.questions.map(function(q, i){
      var given = results.map(function(r){ return r.detail[i]; });
      var correctN = given.filter(function(g){ return g.correct; }).length;
      var rate = results.length ? correctN/results.length : 0;
      var tally = {};
      given.forEach(function(g){
        if(g.correct) return;
        var key = g.given ? g.given : "무응답";
        tally[key] = (tally[key]||0) + 1;
      });
      var dist = Object.keys(tally).map(function(k){ return {answer:k, count:tally[k]}; })
        .sort(function(a,b){ return b.count-a.count; });
      return { no:q.no, answer:q.answer, type:q.type, score:Number(q.score)||0, correctN:correctN, rate:rate, dist:dist };
    });
  }

  function statusOf(rate){
    if(rate >= 0.8) return "good";
    if(rate >= 0.5) return "warning";
    return "critical";
  }
  function statusLabel(s){
    return s==="good" ? "양호" : s==="warning" ? "주의" : "위험";
  }
  function statusColorVar(s){
    return s==="good" ? "var(--good)" : s==="warning" ? "var(--warning)" : "var(--critical)";
  }

  /* ---------- achievement bands ---------- */
  var BAND_LABELS = ["60점 미만","60~69점","70~79점","80~89점","90~100점"];
  function bandIndexOf(pct){
    if(pct>=90) return 4;
    if(pct>=80) return 3;
    if(pct>=70) return 2;
    if(pct>=60) return 1;
    return 0;
  }
  function bandColorVar(i){
    return "var(--band-"+(i+1)+")";
  }

  /* ---------- svg chart helpers (line / column) ---------- */
  function svgEsc(s){ return xmlEscape(String(s)); }

  function niceTickStep(rawStep, minStep){
    if(rawStep <= (minStep||0)) return minStep || 1;
    var mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var norm = rawStep / mag;
    var step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    step = step * mag;
    if(minStep) step = Math.max(minStep, Math.ceil(step/minStep)*minStep);
    return step;
  }
  function computeNiceTicks(maxValue, targetTicks, minStep){
    var step = niceTickStep((maxValue || 1) / (targetTicks || 4), minStep);
    var niceMax = Math.ceil((maxValue || 1) / step) * step;
    if(niceMax <= 0) niceMax = step;
    var ticks = [];
    for(var v=0; v<=niceMax+1e-9; v+=step) ticks.push(Math.round(v*1000)/1000);
    return { max: niceMax, ticks: ticks };
  }

  function buildColumnChartSvg(opts){
    var width = 680, height = opts.height || 220;
    var padL = 34, padR = 16, padT = 22, padB = 26;
    var innerW = width - padL - padR, innerH = height - padT - padB;
    var bars = opts.bars, n = bars.length;
    var rawMax = Math.max(1, opts.yMax || Math.max.apply(null, bars.map(function(b){ return b.value; })));
    var niceInfo = computeNiceTicks(rawMax, 4, opts.integerTicks ? 1 : undefined);
    var yMax = niceInfo.max;
    var gap = 16;
    var barW = Math.min(70, (innerW - gap*(n-1)) / n);
    var totalW = barW*n + gap*(n-1);
    var startX = padL + (innerW-totalW)/2;
    function yAt(v){ return padT + innerH * (1 - v/yMax); }

    var parts = [];
    niceInfo.ticks.forEach(function(val){
      var y = yAt(val);
      parts.push('<line x1="'+padL+'" y1="'+y+'" x2="'+(width-padR)+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>');
      parts.push('<text x="'+(padL-8)+'" y="'+(y+3.5)+'" font-size="10" fill="var(--text-3)" text-anchor="end">'+val+'</text>');
    });
    bars.forEach(function(b,i){
      var x = startX + i*(barW+gap);
      var y = yAt(b.value);
      var h = (padT+innerH) - y;
      if(opts.clickable){
        // 값이 0이어도 클릭할 수 있도록, 막대 칸 전체에 보이지 않는 클릭 영역을 깔아둡니다.
        parts.push('<rect x="'+x+'" y="'+padT+'" width="'+barW+'" height="'+innerH+'" fill="transparent" style="cursor:pointer;" data-band-idx="'+i+'"/>');
      }
      parts.push('<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+Math.max(0,h)+'" rx="4" fill="'+b.color+'" pointer-events="none"/>');
      parts.push('<text x="'+(x+barW/2)+'" y="'+(y-6)+'" font-size="11" font-weight="700" fill="var(--text-2)" text-anchor="middle" pointer-events="none">'+svgEsc(b.value)+'</text>');
      parts.push('<text x="'+(x+barW/2)+'" y="'+(height-7)+'" font-size="10" fill="var(--text-3)" text-anchor="middle" pointer-events="none">'+svgEsc(b.label)+'</text>');
    });
    return '<svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;display:block;">'+parts.join("")+'</svg>';
  }

  /* ---------- STEP 4 : dashboard ---------- */
  function renderStep4(){
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    var results = gradeAll();

    if(!results.length || !state.questions.length){
      var empty = el("div", {class:"card"}, [el("p", {class:"empty"}, ["분석할 데이터가 없습니다. 이전 단계를 완료해주세요."])]);
      panel.appendChild(empty);
      return;
    }

    var scores = results.map(function(r){ return r.score; });
    var avg = mean(scores), sd = stdev(scores), mx = Math.max.apply(null, scores), mn = Math.min.apply(null, scores);
    var qstats = questionStats(results);
    var sortedQ = qstats.slice().sort(function(a,b){ return a.rate-b.rate; });
    var maxTotal = state.questions.reduce(function(a,q){ return a + (Number(q.score)||0); }, 0);
    // 동점이면 같은 순위를 주고, 그 다음 순위는 인원수만큼 건너뜁니다 (1, 1, 3 …)
    var ranked = [], prevScore = null, prevRank = 0;
    results.slice().sort(function(a,b){ return b.score-a.score; }).forEach(function(r, i){
      var rank = (prevScore !== null && r.score === prevScore) ? prevRank : (i + 1);
      prevScore = r.score; prevRank = rank;
      ranked.push(Object.assign({ rank: rank, rate: r.total ? r.correctCount/r.total : 0 }, r));
    });

    var head = el("div", {});
    consumeImportNotice(head);
    if(state.examTitle) head.appendChild(el("p", {class:"exam-title"}, ["평가 ", el("b", {}, [state.examTitle])]));
    if(head.childNodes.length) panel.appendChild(head);

    var RESULT_TABS = [["summary","요약"],["questions","문항별 분석"],["students","학생별 성적"]];
    var tabsBar = el("div", {style:"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;"});
    var tabsNav = el("div", {class:"result-tabs", style:"flex:1;min-width:200px;"});
    RESULT_TABS.forEach(function(t){
      var key = t[0], label = t[1];
      var b = el("button", {class:"result-tab"+(state.resultTab===key?" active":""), type:"button", onclick:function(){
        state.resultTab = key; save(); renderStep4();
      }}, [label]);
      tabsNav.appendChild(b);
    });
    tabsBar.appendChild(tabsNav);
    var reportArgs = [results, scores, avg, sd, mx, mn, qstats, sortedQ, maxTotal, ranked];
    var reportMsg = el("div", {});
    function reportNotify(text, kind){
      reportMsg.innerHTML = "";
      reportMsg.appendChild(el("div", {class:"msg " + (kind || "ok")}, [text]));
    }
    var reportBtns = el("div", {style:"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"}, [
      el("button", {class:"btn small", type:"button", onclick:function(){
        exportPDF(reportArgs, reportNotify);
      }}, ["🖨 결과 인쇄 · PDF로 저장"]),
      el("button", {class:"btn ghost small", type:"button", onclick:function(){
        reportNotify("리포트를 만드는 중…", "info");
        saveReportFile(reportArgs, reportNotify);
      }}, ["⬇ 리포트 파일 저장"])
    ]);
    tabsBar.appendChild(reportBtns);
    panel.appendChild(tabsBar);
    panel.appendChild(reportMsg);

    if(state.resultTab === "questions"){
      buildQuestionsTab(panel, sortedQ, results);
    } else if(state.resultTab === "students"){
      buildStudentsTab(panel, ranked, results);
    } else {
      buildSummaryTab(panel, results, scores, avg, sd, mx, mn, maxTotal);
    }

    var btnRow = el("div", {class:"btn-row"});
    btnRow.appendChild(el("button", {class:"btn", onclick:function(){ state.step=3; save(); renderAll(); }}, ["← 이전"]));
    btnRow.appendChild(el("div",{class:"right"}));
    panel.appendChild(btnRow);
  }

  function buildSummaryTab(panel, results, scores, avg, sd, mx, mn, maxTotal){
    var tiles = el("div", {class:"tiles"});
    [
      ["응시 학생 수", results.length + "명"],
      ["평균", fmt1(avg) + "점"],
      ["표준편차", fmt1(sd)],
      ["최고점", mx + "점"],
      ["최저점", mn + "점"],
      ["중앙값", fmt1(median(scores)) + "점"]
    ].forEach(function(t){
      tiles.appendChild(el("div", {class:"tile"}, [
        el("div", {class:"label"}, [t[0]]),
        el("div", {class:"value"}, [t[1]])
      ]));
    });
    panel.appendChild(tiles);

    function pctOf(r){ return maxTotal ? clampPct(r.score/maxTotal*100) : 0; }
    var bandCounts = [0,0,0,0,0];
    var bandMembers = [[],[],[],[],[]];
    results.forEach(function(r){
      var bi = bandIndexOf(pctOf(r));
      bandCounts[bi]++;
      bandMembers[bi].push(r);
    });
    bandMembers.forEach(function(list){ list.sort(function(a,b){ return b.score-a.score; }); });

    // achievement distribution (stacked bar + legend)
    var distCard = el("div", {class:"card"});

  function buildStudentsTab(panel, ranked, results){
    var stCard = el("div", {class:"card"});
    stCard.appendChild(el("h2", {style:"margin:0 0 4px;"}, ["학생별 성적"]));
    stCard.appendChild(el("p", {class:"hint"}, ["행을 클릭하면 학생의 문항별 정오답을 볼 수 있어요."]));
    stCard.appendChild(buildExportRow({
      label: "채점 결과 저장",
      filename: (state.examTitle ? state.examTitle + "_" : "") + "채점결과",
      sheetName: "채점결과",
      hint: "문항별 O/X까지 함께 저장됩니다.",
      rows: function(){ return resultRows(results); }
    }));

    // '번호'처럼 숫자가 문자로 들어 있는 열도 1, 2, 10 순서로 정렬합니다.
    function compareCell(av, bv){
      if(typeof av === "number" && typeof bv === "number") return av - bv;
      var as = String(av === undefined || av === null ? "" : av).trim();
      var bs = String(bv === undefined || bv === null ? "" : bv).trim();
      var an = parseFloat(as), bn = parseFloat(bs);
      var aIsNum = as !== "" && isFinite(an) && /^-?\d/.test(as);
      var bIsNum = bs !== "" && isFinite(bn) && /^-?\d/.test(bs);
      if(aIsNum && bIsNum && an !== bn) return an - bn;
      if(aIsNum !== bIsNum) return aIsNum ? -1 : 1;
      return as.localeCompare(bs, "ko");
    }
    function applySort(list){
      var key = state.sort.key, dir = state.sort.dir === "asc" ? 1 : -1;
      return list.slice().sort(function(a,b){
        var c = compareCell(a[key], b[key]);
        if(c !== 0) return c * dir;
        return b.score - a.score;  // 동점·동일 값이면 점수 높은 순
      });
    }

    var wrap2 = el("div", {class:"table-wrap"});
    var table2 = el("table");
    var cols = [["rank","순위"],["num","번호"],["name","이름"],["score","총점"],["correctCount","정답 수"],["rate","정답률"]];
    var headRow = el("tr", {});
    cols.forEach(function(c){
      var th = el("th", {class: (c[0]==="score"||c[0]==="correctCount"||c[0]==="rate"||c[0]==="rank") ? "num sortable":"sortable"}, [c[1]]);
      th.addEventListener("click", function(){
        if(state.sort.key===c[0]) state.sort.dir = state.sort.dir==="asc" ? "desc" : "asc";
        else { state.sort.key = c[0]; state.sort.dir = "desc"; }
        save(); renderStep4();
      });
      headRow.appendChild(th);
    });
    table2.appendChild(el("thead",{},[headRow]));
    var tbody2 = el("tbody");
    applySort(ranked).forEach(function(r){
      var tr = el("tr", {tabindex:"0", style:"cursor:pointer;"}, [
        el("td",{class:"num"},[String(r.rank)]),
        el("td",{},[r.num]),
        el("td",{},[r.name]),
        el("td",{class:"num"},[String(r.score)]),
        el("td",{class:"num"},[r.correctCount+"/"+r.total]),
        el("td",{class:"num"},[Math.round(r.rate*100)+"%"])
      ]);
      tr.addEventListener("click", function(){ openStudentModal(r); });
      tbody2.appendChild(tr);
    });
    table2.appendChild(tbody2);
    wrap2.appendChild(table2);
    stCard.appendChild(wrap2);
    panel.appendChild(stCard);

    // whole-class correct/wrong heatmap
    var heatCard = el("div", {class:"card"});
    heatCard.appendChild(el("h2", {}, ["학생 × 문항 정오답 히트맵"]));
    heatCard.appendChild(el("p", {class:"hint"}, ["점수 높은 순으로 정렬했습니다. 붉은 칸이 세로로 몰려 있으면 그 문항을 많은 학생이 틀렸다는 뜻이에요."]));
    var heatLegend = el("div", {class:"legend"}, [
      el("span", {class:"item"}, [el("span",{class:"swatch",style:"background:var(--good);"}), "정답"]),
      el("span", {class:"item"}, [el("span",{class:"swatch",style:"background:var(--critical);"}), "오답"])
    ]);
    heatCard.appendChild(heatLegend);
    var heatWrap = el("div", {class:"table-wrap"});
    var heatTable = el("table", {class:"heatmap-table"});
    var heatHead = [el("th",{},["학생"])];
    (ranked[0] ? ranked[0].detail : []).forEach(function(d){ heatHead.push(el("th",{class:"num"},[String(d.no)])); });
    heatTable.appendChild(el("thead",{},[el("tr",{},heatHead)]));
    var heatBody = el("tbody");
    applySort(ranked).forEach(function(r){
      var cells = [el("td",{},[r.num+"번 "+r.name])];
      r.detail.forEach(function(d){
        cells.push(el("td",{class:"heat-cell "+(d.correct?"heat-good":"heat-bad")},[d.correct?"O":"X"]));
      });
      heatBody.appendChild(el("tr",{},cells));
    });
    heatTable.appendChild(heatBody);
    heatWrap.appendChild(heatTable);
    heatCard.appendChild(heatWrap);
    panel.appendChild(heatCard);
  }

  function resultRows(results){
    var header = ["번호","이름","총점","정답수","문항수","정답률(%)"];
    header = header.concat(state.questions.map(function(q){ return String(q.no); }));
    var rows = [header];
    results.forEach(function(r){
      var base = [r.num, r.name, r.score, r.correctCount, r.total, r.total ? Math.round(r.correctCount/r.total*100) : 0];
      rows.push(base.concat(r.detail.map(function(d){ return d.correct ? "O" : "X"; })));
    });
    return rows;
  }
